name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main  # Ejecutar en cada push a la rama main
  workflow_dispatch:  # Permitir ejecución manual

# Configurar permisos requeridos para GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evitar despliegues simultáneos
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Compile Documentation and Copy Assets
        run: |
          python3 scripts/build_docs.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/website'  # Servir directamente la SPA compilada

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
